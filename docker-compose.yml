services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umber_collection
      POSTGRES_USER: umber
      POSTGRES_PASSWORD: umber-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - umber-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umber -d umber_collection"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  umber-postgres:
